[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pcb-weaver"
version = "0.4.0"
description = "Constraint-driven PCB engineering workflows with revision-bound verification and MCP"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "pydantic>=2.8,<3", "sexpdata>=1.0,<2", "scipy>=1.13,<2", "shapely>=2.0,<3", "starlette>=0.40,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24", "jsonschema>=4.20,<5", "httpx>=0.27,<1"]

[project.scripts]
pcb-weaver = "pcb_weaver.cli:main"
pcb-weaver-mcp = "pcb_weaver.server:main"
pcb-weaver-platform = "pcb_weaver.platform:main"
pcb-weaver-worker = "pcb_weaver.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pcb_weaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
