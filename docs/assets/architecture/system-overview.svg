<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1390" viewBox="0 0 1760 1390" role="img" aria-labelledby="title desc">
<title id="title">01  系统总览  /  System architecture</title><desc id="desc">MCP、工作台和可选机器接口连接 KiCad 工程服务。持久任务由工作台或独立 Worker 执行；布局、布线、验证和发布共享版本门禁。Altium 使用独立 MCP、SQLite 和 Worker，仅提供静态检查内测。</desc>
