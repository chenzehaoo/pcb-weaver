<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1130" viewBox="0 0 1760 1130" role="img" aria-labelledby="title desc">
<title id="title">04  执行与接入  /  Runtime and integration boundaries</title><desc id="desc">MCP 直接工具同步调用工程服务，长任务写入 SQLite。工作台线程或独立 Worker 单活领取任务，执行后保存结果。机器接口默认关闭，授权不保护其他本机入口。</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#3C6D9C" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#287F7A" stroke-width="1.6"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#AD7733" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#AD5552" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#63758A" stroke-width="1.6"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",Arial,sans-serif} .mono{font-family:Consolas,"Liberation Mono",monospace}</style>
<rect x="0" y="0" width="1760" height="1130" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="48" y="57" font-size="34" fill="#24364B" font-weight="700" text-anchor="start">04  执行与接入  /  Runtime and integration boundaries</text>
<text x="48" y="99" font-size="20" fill="#63758A" font-weight="400" text-anchor="start">会话生命周期 ≠ 作业生命周期；任务与运行配置持久化到同一个 KiCad 工作区</text>
<path d="M48 124 H1712" stroke="#BCCAD6"/>
<rect x="48" y="164" width="1664" height="710" rx="12" fill="#F4F7FA" stroke="#3C6D9C" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="70" y="200" font-size="24" fill="#3C6D9C" font-weight="700" text-anchor="start">同一受信任工作站  /  trusted local workstation</text>
<rect x="80" y="235" width="450" height="128" rx="8" fill="white" stroke="#3C6D9C" stroke-width="1.5"/>
<path d="M82 247 V351" stroke="#3C6D9C" stroke-width="4"/>
<text x="102" y="273" font-size="24" fill="#3C6D9C" font-weight="700" text-anchor="start">AI 客户端 → stdio MCP</text>
<text x="102" y="307" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">.mcp.json · 独立 Python 进程</text>
<text x="102" y="336" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">server.py 不启动队列 Worker</text>
<rect x="80" y="426" width="450" height="128" rx="8" fill="white" stroke="#3C6D9C" stroke-width="1.5"/>
<path d="M82 438 V542" stroke="#3C6D9C" stroke-width="4"/>
<text x="102" y="464" font-size="24" fill="#3C6D9C" font-weight="700" text-anchor="start">浏览器 → HTTP 工作台</text>
<text x="102" y="498" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">127.0.0.1:8765</text>
<text x="102" y="527" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">platform.py 默认启动队列线程</text>
<rect x="80" y="617" width="450" height="182" rx="8" fill="white" stroke="#AD7733" stroke-width="1.5"/>
<path d="M82 629 V787" stroke="#AD7733" stroke-width="4"/>
<text x="102" y="655" font-size="24" fill="#AD7733" font-weight="700" text-anchor="start">本机连接器 → 机器接口</text>
<text x="102" y="689" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">默认关闭 · Bearer + 工程白名单</text>
<text x="102" y="718" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">写开关 + Idempotency-Key</text>
<text x="102" y="747" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">机器接口不接收任意导入路径</text>
<text x="102" y="776" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">机器令牌不保护 MCP / 工作台</text>
<path d="M653 429 C653 409,1113 409,1113 429 V556 C1113 576,653 576,653 556 Z" fill="white" stroke="#287F7A" stroke-width="1.7"/>
<path d="M653 429 C653 449,1113 449,1113 429" fill="none" stroke="#287F7A" stroke-width="1.4"/>
<text x="883.0" y="471" font-size="23" fill="#287F7A" font-weight="700" text-anchor="middle">ledger.sqlite3</text>
<text x="883.0" y="502" font-size="19" fill="#24364B" font-weight="400" text-anchor="middle">jobs / job_events / revisions</text>
<text x="883.0" y="529" font-size="19" fill="#24364B" font-weight="400" text-anchor="middle">请求、运行配置与输入指纹</text>
<rect x="653" y="235" width="460" height="128" rx="8" fill="white" stroke="#287F7A" stroke-width="1.5"/>
<path d="M655 247 V351" stroke="#287F7A" stroke-width="4"/>
<text x="675" y="273" font-size="24" fill="#287F7A" font-weight="700" text-anchor="start">EngineeringService</text>
<text x="675" y="307" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">直接工具同步调用</text>
<text x="675" y="336" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">共享版本、约束和发布门禁</text>
<path d="M530 291 L653 291" fill="none" stroke="#287F7A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="537" y="258" width="94" height="27" rx="3" fill="white" stroke="none" stroke-width="1.5"/>
<text x="544" y="278" font-size="19" fill="#287F7A" font-weight="400" text-anchor="start">直接工具</text>
<path d="M305 363 L305 392 L780 392 L780 414" fill="none" stroke="#3C6D9C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="545" y="365" width="134" height="27" rx="3" fill="white" stroke="none" stroke-width="1.5"/>
<text x="552" y="385" font-size="19" fill="#3C6D9C" font-weight="400" text-anchor="start">提交持久任务</text>
<path d="M530 490 L653 490" fill="none" stroke="#3C6D9C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<path d="M530 709 L603 709 L603 541 L653 541" fill="none" stroke="#AD7733" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
<rect x="1220" y="235" width="460" height="182" rx="8" fill="white" stroke="#287F7A" stroke-width="1.5"/>
<path d="M1222 247 V405" stroke="#287F7A" stroke-width="4"/>
<text x="1242" y="273" font-size="24" fill="#287F7A" font-weight="700" text-anchor="start">单活执行器</text>
<text x="1242" y="307" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">工作台线程 或 worker.py</text>
<text x="1242" y="336" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">相同 workspace + config</text>
<text x="1242" y="365" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">OS 锁 + 数据库事务领取</text>
<text x="1242" y="394" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">阶段边界取消 · 保存进度</text>
<path d="M1113 493 L1166 493 L1166 327 L1220 327" fill="none" stroke="#287F7A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="1162" y="457" width="54" height="27" rx="3" fill="white" stroke="none" stroke-width="1.5"/>
<text x="1169" y="477" font-size="19" fill="#287F7A" font-weight="400" text-anchor="start">领取</text>
<path d="M1220 277 L1113 277" fill="none" stroke="#287F7A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="1220" y="520" width="460" height="128" rx="8" fill="white" stroke="#287F7A" stroke-width="1.5"/>
<path d="M1222 532 V636" stroke="#287F7A" stroke-width="4"/>
<text x="1242" y="558" font-size="24" fill="#287F7A" font-weight="700" text-anchor="start">原生工具子进程</text>
<text x="1242" y="592" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">KiCad / pcbnew / Java</text>
<text x="1242" y="621" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">工具链配置 · 超时 · 原生日志</text>
<path d="M1450 417 L1450 520" fill="none" stroke="#287F7A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="1459" y="453" width="54" height="27" rx="3" fill="white" stroke="none" stroke-width="1.5"/>
<text x="1466" y="473" font-size="19" fill="#287F7A" font-weight="400" text-anchor="start">执行</text>
<rect x="653" y="679" width="460" height="120" rx="8" fill="white" stroke="#3C6D9C" stroke-width="1.5"/>
<path d="M655 691 V787" stroke="#3C6D9C" stroke-width="4"/>
<text x="675" y="717" font-size="24" fill="#3C6D9C" font-weight="700" text-anchor="start">查询与恢复</text>
<text x="675" y="751" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">按 job_id 查询；客户端可重连</text>
<text x="675" y="780" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">无 Worker → queued 保持不动</text>
<path d="M883 571 L883 679" fill="none" stroke="#3C6D9C" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<rect x="1220" y="706" width="460" height="93" rx="8" fill="white" stroke="#287F7A" stroke-width="1.5"/>
<path d="M1222 718 V787" stroke="#287F7A" stroke-width="4"/>
<text x="1242" y="744" font-size="24" fill="#287F7A" font-weight="700" text-anchor="start">产物与阶段证据</text>
<text x="1242" y="778" font-size="20" fill="#24364B" font-weight="400" text-anchor="start">写入 workspace；客户端查询</text>
<path d="M1450 648 L1450 706" fill="none" stroke="#287F7A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path d="M1220 754 L1113 754" fill="none" stroke="#287F7A" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-teal)" stroke-dasharray="7 6"/>
<rect x="48" y="923" width="1664" height="103" rx="8" fill="#EDF3FA" stroke="#BCCAD6" stroke-width="1.5"/>
<text x="76" y="962" font-size="23" fill="#3C6D9C" font-weight="700" text-anchor="start">KiCad 作业状态</text>
<text x="330" y="962" font-size="21" fill="#24364B" font-weight="400" text-anchor="start" class="mono">queued → running → completed / blocked / failed / cancelled / interrupted</text>
<text x="76" y="1002" font-size="22" fill="#24364B" font-weight="400" text-anchor="start">旧 Worker 丢失后的 running → interrupted；不自动重放可能已经产生版本的工程修改。</text>
<path d="M48 1043 H1712" stroke="#BCCAD6"/>
<text x="48" y="1074" font-size="19" fill="#63758A" font-weight="400" text-anchor="start">本图是本机执行模型，非分布式集群。SQLite 与单活 Worker 不等于多租户隔离或高可用；MCP 的 stdio 不是工作台 HTTP 地址。</text>
<text x="1712" y="1110" font-size="14" fill="#63758A" font-weight="400" text-anchor="end">PCB WEAVER  /  TECHNICAL ARCHITECTURE</text>
</svg>
